name: Plugin version

# No paths filter: a required check skipped by one would wait forever. The script decides
# whether the pull request changes shipped files.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  version:
    name: Plugin version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test the check
        run: bash .github/scripts/check-version-bump.test.sh
      - name: Compare the plugin version with main's
        run: bash .github/scripts/check-version-bump.sh
