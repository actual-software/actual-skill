interface:
  display_name: "Draft ADRs"
  short_description: "Draft ADRs and create the ones you pick, in docs/adr or in Actual AI"
  default_prompt: "Use $adr-draft to draft ADRs about this topic, the work in this session, or the last N commits if I give a number, then let me pick which to create."
